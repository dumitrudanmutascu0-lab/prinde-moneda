
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prinde moneda</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    #game {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 600px;
      margin: auto;
      background: #222;
      overflow: hidden;
    }

    #info {
      padding: 12px;
      font-size: 19px;
    }

    #coin, #special, #bomb {
      position: absolute;
      font-size: 45px;
      cursor: pointer;
      user-select: none;
    }

    #start {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #222;
    }

    button {
      padding: 15px 25px;
      font-size: 20px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="game">

  <div id="info">
    🪙 Scor: <span id="score">0</span>
    &nbsp; | &nbsp;
    ⏱️ Timp: <span id="time">30</span>
    &nbsp; | &nbsp;
    ⭐ Nivel: <span id="level">1</span>
  </div>

  <div id="coin">🪙</div>
  <div id="special">💚</div>
  <div id="bomb">💣</div>

  <div id="start">
    <h1>Prinde moneda!</h1>
    <p>🪙 = 1 punct &nbsp; 💚 = 5 puncte</p>
    <p>💣 = pierzi runda!</p>
    <button onclick="startGame()">JOACĂ</button>
  </div>

</div>

<script>
  let score = 0;
  let best = Number(localStorage.getItem("bestScore")) || 0;
  let time = 30;
  let level = 1;
  let playing = false;
  let timer;

  const coin = document.getElementById("coin");
  const special = document.getElementById("special");
  const bomb = document.getElementById("bomb");

  const scoreText = document.getElementById("score");
  const timeText = document.getElementById("time");
  const levelText = document.getElementById("level");

  const start = document.getElementById("start");
  const game = document.getElementById("game");

  function randomPosition(element) {
    const maxX = game.clientWidth - 60;
    const maxY = game.clientHeight - 100;

    element.style.left = Math.random() * maxX + "px";
    element.style.top = 60 + Math.random() * maxY + "px";
  }

  function update() {
    scoreText.textContent = score;
    timeText.textContent = time;
    levelText.textContent = level;
  }

  function startGame() {
    score = 0;
    time = 30;
    level = 1;
    playing = true;

    start.style.display = "none";

    coin.style.display = "block";
    special.style.display = "block";
    bomb.style.display = "block";

    randomPosition(coin);
    randomPosition(special);
    randomPosition(bomb);

    update();

    clearInterval(timer);

    timer = setInterval(function () {
      time--;

      if (score >= level * 10) {
        level++;
      }

      update();

      if (time <= 0) {
        endGame();
      }
    }, 1000);
  }

  function endGame() {
    playing = false;
    clearInterval(timer);

    coin.style.display = "none";
    special.style.display = "none";
    bomb.style.display = "none";

    if (score > best) {
      best = score;
      localStorage.setItem("bestScore", best);
    }

    document.querySelector("#start h1").textContent =
      "Bravo! 🎉";

    document.querySelector("#start p").textContent =
      "Ai făcut " + score + " puncte! Record: " + best;

    document.querySelector("#start button").textContent =
      "JOACĂ DIN NOU";

    start.style.display = "flex";
  }

  
    coin.onclick = function () {
  if (!playing) return;

  score++;

  coin.style.transform = "scale(1.4)";
  setTimeout(() => {
    coin.style.transform = "scale(1)";
  }, 100);

  randomPosition(coin);
  randomPosition(bomb);

  if (score % 10 === 0) {
    level++;
  }

  update();
};

  special.onclick = function () {
    if (!playing) return;

    score += 5;

    randomPosition(special);
    randomPosition(bomb);

    if (score % 10 === 0) {
      level++;
    }

    update();
  };

  bomb.onclick = function () {
    if (!playing) return;

    endGame();
  };

  coin.style.display = "none";
  special.style.display = "none";
  bomb.style.display = "none";
</script>

</body>
</html>
